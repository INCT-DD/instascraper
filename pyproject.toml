[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-academic-collector"
version = "0.1.0"
description = "Daily Instagram collection pipeline for academic research."
requires-python = ">=3.10"
dependencies = [
    "httpx[http2]>=0.28",
    "tqdm>=4.67",
    "requests>=2.31",
    "psycopg[binary]>=3.2",
    "gallery-dl>=1.27",
    "tzdata>=2025.2",
]

[project.scripts]
instagram-collector = "instagram_collector.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["instagram_scraper", "pipeline"]

[tool.setuptools.packages.find]
where = ["src"]
